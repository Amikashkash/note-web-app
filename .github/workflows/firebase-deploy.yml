name: CI and deploy

# בדיקות על כל pull request ועל כל push ל-main. פריסה רק מ-main, ורק
# אחרי שכל הבדיקות עברו (`needs: test`).
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# הרשאות מינימליות לכל ה-jobs. אף job לא צריך לכתוב לריפו.
permissions:
  contents: read

jobs:
  test:
    name: Lint, build, typecheck and test
    runs-on: ubuntu-latest
    # בלי secrets בכלל: ה-job הזה רץ גם על pull requests, והבנייה כאן היא
    # בדיקת קומפילציה בלבד. הבנייה שנפרסת נעשית ב-job של הפריסה.

    steps:
      # כל ה-actions נעוצים ל-SHA של commit ולא ל-tag, כי tag אפשר להזיז.
      # ההערה מציינת את הגרסה שה-SHA מצביע עליה, לעדכון עתידי.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      # ה-Firestore Emulator הוא JAR ודורש Java
      - name: Setup Java (Firestore emulator)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Lint
        run: npm run lint

      # `npm run build` מריץ `tsc` (כולל קבצי הבדיקות) ואז `vite build`
      - name: Typecheck and build client
        run: npm run build

      - name: Client unit tests
        run: npm test

      - name: Build functions
        run: npm run build
        working-directory: functions

      - name: Typecheck functions (including tests)
        run: npm run typecheck
        working-directory: functions

      - name: Functions unit tests
        run: npm test
        working-directory: functions

      # מרים Firestore Emulator על פרויקט demo, מריץ את בדיקות ה-rules ומכבה
      - name: Firestore rules tests (emulator)
        run: npm run test:rules

  deploy:
    name: Deploy to Firebase
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # `id-token: write` מאפשר ל-GitHub להנפיק OIDC token להרצה הזו, ש-Google
    # מחליף בהרשאות זמניות (Workload Identity Federation). ניתן רק ל-job
    # הזה - ה-job של הבדיקות רץ על pull requests ואסור שיוכל לקבל אותו.
    permissions:
      contents: read
      id-token: write
    # פריסה אחת בכל רגע. פריסה שכבר התחילה לא מבוטלת באמצע.
    concurrency:
      group: deploy-main
      cancel-in-progress: false

    steps:
      # נכשל מוקדם ובהודעה ברורה אם משתני ה-WIF חסרים או בפורמט שגוי,
      # במקום שגיאת אימות סתומה אחרי הבנייה
      - name: Check Workload Identity configuration
        env:
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.WIF_SERVICE_ACCOUNT }}
        run: |
          case "$WIF_PROVIDER" in
            projects/[0-9]*/locations/global/workloadIdentityPools/*/providers/*) ;;
            *) echo "::error::WIF_PROVIDER must look like projects/<project-number>/locations/global/workloadIdentityPools/<pool>/providers/<provider>. Current value: '$WIF_PROVIDER'"; exit 1 ;;
          esac
          case "$WIF_SERVICE_ACCOUNT" in
            *@*.iam.gserviceaccount.com) ;;
            *) echo "::error::WIF_SERVICE_ACCOUNT must be a service account email. Current value: '$WIF_SERVICE_ACCOUNT'"; exit 1 ;;
          esac

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          # בלי המפתח הזה ה-build מצליח אבל ההתראות מתות בשקט:
          # `isPushConfigured` יוצא false ואף מכשיר לא נרשם ל-push.
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}

      # אין מפתח JSON: Google מאמת את ה-token של GitHub מול ה-provider,
      # שמקבל רק את ה-repo הזה וה-branch `main`, ומנפיק הרשאות זמניות של
      # `github-deployer` (תפקידים מינימליים). ההגדרה: `thinking/ci-workload-identity.md`.
      # `token_format: access_token` מכריח את ה-action לבצע את ההחלפה מול
      # Google כבר כאן (STS + התחזות ל-service account). בלעדיו הוא רק כותב
      # קובץ הגדרות ומצליח תמיד, וכל תקלה ב-provider, בתנאי או ב-binding
      # מתגלה רק בתוך firebase-tools - שם היא נבלעת בהודעה הכללית
      # "Failed to authenticate, have you run firebase login?".
      # ה-token עצמו לא בשימוש (firebase-tools משתמש בקובץ) ומוסתר בלוג.
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
          token_format: access_token
          # מגדיר GOOGLE_APPLICATION_CREDENTIALS לשלבים הבאים
          create_credentials_file: true

      # ה-CLI מגיע מ-`firebase-tools` שנעוץ ב-package-lock, ולא מ-action של
      # צד שלישי. Hosting, rules ו-indexes בפקודה אחת.
      # פונקציות הענן עדיין נפרסות ידנית - ה-CI רק בונה ובודק אותן.
      - name: Deploy Hosting, Firestore rules and indexes
        run: npx --no-install firebase deploy --only hosting,firestore --project notes-4-me --non-interactive
