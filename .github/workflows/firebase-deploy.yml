name: CI and deploy

# בדיקות על כל pull request ועל כל push ל-main. פריסה רק מ-main, ורק
# אחרי שכל הבדיקות עברו (`needs: test`).
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# הרשאות מינימליות לכל ה-jobs. אף job לא צריך לכתוב לריפו.
permissions:
  contents: read

jobs:
  test:
    name: Lint, build, typecheck and test
    runs-on: ubuntu-latest
    # בלי secrets בכלל: ה-job הזה רץ גם על pull requests, והבנייה כאן היא
    # בדיקת קומפילציה בלבד. הבנייה שנפרסת נעשית ב-job של הפריסה.

    steps:
      # כל ה-actions נעוצים ל-SHA של commit ולא ל-tag, כי tag אפשר להזיז.
      # ההערה מציינת את הגרסה שה-SHA מצביע עליה, לעדכון עתידי.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      # ה-Firestore Emulator הוא JAR ודורש Java
      - name: Setup Java (Firestore emulator)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Lint
        run: npm run lint

      # `npm run build` מריץ `tsc` (כולל קבצי הבדיקות) ואז `vite build`
      - name: Typecheck and build client
        run: npm run build

      - name: Client unit tests
        run: npm test

      - name: Build functions
        run: npm run build
        working-directory: functions

      - name: Typecheck functions (including tests)
        run: npm run typecheck
        working-directory: functions

      - name: Functions unit tests
        run: npm test
        working-directory: functions

      # מרים Firestore Emulator על פרויקט demo, מריץ את בדיקות ה-rules ומכבה
      - name: Firestore rules tests (emulator)
        run: npm run test:rules

  deploy:
    name: Deploy to Firebase
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # פריסה אחת בכל רגע. פריסה שכבר התחילה לא מבוטלת באמצע.
    concurrency:
      group: deploy-main
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          # בלי המפתח הזה ה-build מצליח אבל ההתראות מתות בשקט:
          # `isPushConfigured` יוצא false ואף מכשיר לא נרשם ל-push.
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: notes-4-me

      # ה-CLI מגיע מ-`firebase-tools` שנעוץ ב-package-lock, ולא מ-action של
      # צד שלישי (`w9jds/firebase-action@master` קיבל את מפתח השירות
      # מ-branch שכל אחד עם הרשאה לריפו שלו יכול לשנות).
      #
      # המפתח נכתב לקובץ זמני בהרשאות 600 ונמחק בסיום, גם בכישלון.
      # פונקציות הענן עדיין נפרסות ידנית - ה-CI רק בונה ובודק אותן.
      - name: Deploy Firestore rules and indexes
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          creds="$RUNNER_TEMP/firebase-sa.json"
          trap 'rm -f "$creds"' EXIT
          (umask 077 && printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$creds")
          GOOGLE_APPLICATION_CREDENTIALS="$creds" \
            npx --no-install firebase deploy --only firestore --project notes-4-me --non-interactive
